[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dottle-sdk"
version = "0.1.4"
description = "Dottle SDK — Instrument your AI agents in 3 lines of code. See every LLM call, tool, cost, and failure in real time."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Dottle", email = "support@dottle.dev" }]
keywords = ["ai", "agents", "observability", "monitoring", "llm", "tracing", "openai", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage    = "https://dottle.dev"
Docs        = "https://dottle.dev/docs"
Repository  = "https://github.com/abhinawagoo/dottle"
"Bug Tracker" = "https://github.com/abhinawagoo/dottle/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["dottle"]
